name: Padel-Watch

on:
  schedule:
    # Alle 10 Minuten, aber auf krummen Minuten statt */10. Zur vollen Stunde und
    # zu :10/:20/... ist die Warteschlange der kostenlosen Runner am laengsten;
    # GitHub verzoegert geplante Laeufe dann stark oder verwirft sie ganz.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:            # erlaubt manuelles Ausloesen zum Testen

# Der Job darf state.json ins Repo zurueckschreiben
permissions:
  contents: write

# Verhindert, dass sich ueberlappende Laeufe in die Quere kommen
concurrency:
  group: padel-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          KEY_OVERRIDE:       ${{ secrets.KEY_OVERRIDE }}   # optional
        run: python padel_watch.py

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          fi
