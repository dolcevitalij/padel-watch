name: Padel-Watch

on:
  # Den 10-Minuten-Takt loest ein externer Cron-Dienst per workflow_dispatch aus
  # (siehe HANDOFF.md §9). Grund: GitHubs eigener Scheduler hat fuer dieses Repo
  # ueber Stunden keinen einzigen Lauf gestartet - geplante Laeufe sind auf den
  # kostenlosen Runnern nur "best effort" und werden bei Last verworfen.
  schedule:
    # Nur noch Notnetz: einmal pro Stunde, falls der externe Dienst ausfaellt.
    - cron: "7 * * * *"
  workflow_dispatch:            # externer Auslöser + manuelles Testen

# Der Job darf state.json ins Repo zurueckschreiben
permissions:
  contents: write

# Verhindert, dass sich ueberlappende Laeufe in die Quere kommen
concurrency:
  group: padel-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          KEY_OVERRIDE:       ${{ secrets.KEY_OVERRIDE }}   # optional
        run: python padel_watch.py

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          fi
