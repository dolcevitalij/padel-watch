<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel-Watch · Anmelden</title>
<script>
  /* gleiche Theme-Wahl wie die Konsole (index.html) */
  (function(){
    var saved = null;
    try { saved = localStorage.getItem("padelwatch-theme"); } catch(e) {}
    var dark = saved ? saved === "dark"
                     : !window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style>
  :root{
    --bg:#0E1317; --panel:#161D24; --elev:#1C2530; --line:#26313D;
    --ink:#E6EDF3; --mut:#7D8B9A; --busy:#EF4444; --win:#4C9AFF; --onaccent:#0B1220;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html[data-theme="light"]{
    --bg:#F4F6FA; --panel:#FFFFFF; --elev:#EFF2F7; --line:#D5DDE8;
    --ink:#16202B; --mut:#5B6976; --busy:#CE3A34; --win:#2563EB; --onaccent:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
       background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
       border-radius:10px;padding:22px;display:grid;gap:12px}
  h1{font-size:17px;margin:0 0 4px}
  label{font-size:12px;color:var(--mut)}
  input{width:100%;background:var(--elev);border:1px solid var(--line);color:var(--ink);
        border-radius:7px;padding:10px 11px;font-size:16px}
  input:focus{outline:2px solid var(--win);outline-offset:-1px}
  button{background:var(--win);border:1px solid var(--win);color:var(--onaccent);
         font-weight:600;border-radius:7px;padding:10px;font-size:14px;cursor:pointer}
  .err{color:var(--busy);font-size:13px;margin:0}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Padel-Watch</h1>
  <label for="password">Passwort</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <button type="submit">Anmelden</button>
</form>
</body>
</html>
